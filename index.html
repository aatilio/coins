<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>COINS - Cotizador de Criptomonedas</title>
    <link rel="icon" type="image/x-icon" href="btc.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="logo">
                <img src="btc.svg" alt="Logo" class="logo-icon" />
                <span class="logo-text">COINS</span>
            </div>
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar criptomoneda..." autocomplete="off" />
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="topbar-actions">
                <select id="moneda">
                    <option value="usd">$ USD</option>
                    <option value="eur">&euro; EUR</option>
                </select>
                <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="app">
        <section class="hero">
            <h1>Cotizaciones en <span class="accent">Tiempo Real</span></h1>
            <p class="subtitle">Las principales criptomonedas del mercado, actualizadas al instante.</p>
        </section>

        <section class="stats-bar" id="statsBar">
            <div class="stat-pill">
                <span class="stat-pill-label">Market Cap</span>
                <span class="stat-pill-value" id="globalMarketCap">--</span>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-label">Volumen 24h</span>
                <span class="stat-pill-value" id="globalVolume">--</span>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-label">BTC Dominance</span>
                <span class="stat-pill-value" id="btcDominance">--</span>
            </div>
        </section>

        <section class="crypto-grid" id="cryptoGrid">
            <div class="skeleton-grid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>

        <footer class="footer">
            <span>Datos de <a href="https://www.coingecko.com/" target="_blank">CoinGecko</a> &mdash; Desarrollado por <a href="https://alan.arahocorp.com" target="_blank">Alan C.A.</a> &copy; <span id="year"></span></span>
        </footer>
    </main>

    <div class="detail-panel" id="detailPanel">
        <div class="detail-content" id="detailContent">
            <button class="close-detail" id="closeDetail">&times;</button>
        </div>
    </div>

</body>

</html>
